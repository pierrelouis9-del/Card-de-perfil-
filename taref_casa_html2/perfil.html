<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/perfil.css">
    <title>Document</title>
</head>
<body>
    <div class="a" >
        
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="digite seu nome">
        <label for="profissao">Profissão</label>
        <input type="text" id="profissao" placeholder="Digite sua profissão">

        <button id="bt" onclick="mostrar()">Gerar perfil</button>
        <button id="inversion" onclick="inverter()">Modo Escuro</button>

        
        
    </div>

    <div class = "c">
        <h2> Me Avalia</h2>
        <label for="numero">Nota</label>
        <input type="number" id="numero" value="0" min="0" max="10">
    </div>
    
    <div class="b">
        <h1 id="nom"></h1>
        <h2 id="profe"></h2>
        <h2 id="nota"></h2>
    </div>

    <script>
        const mudar = document.getElementById("inversion")

        mudar.addEventListener("click", function(){

            document.body.classList.toggle("dark-mode")

    })

    function mostrar() {

        let nome = document.getElementById("nome").value

        let profissao = document.getElementById("profissao").value

        let numero = document.getElementById("numero").value

        let inicial = nome.charAt(0).toUpperCase()

        document.querySelector(".b").setAttribute("data-letter", inicial)

        if(nome === "" || profissao === ""){

            alert("Digite todas as informações")

        }else{

            document.getElementById("nom").textContent = nome

            document.getElementById("profe").innerHTML =
            "<strong> Profissão:</strong>"+"<h3>"+profissao+"</h3>"

           document.getElementById("nota").innerHTML =
           "<strong>Avaliação:</strong> " + numero + " 🌟"

        }

   }

    </script>
</body>
</html>
