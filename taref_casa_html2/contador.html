<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>

    <link rel="stylesheet" href="css/contador.css">

</head>

<body>
    <h1 id="numero">0</h1>

    <div class="contador">
        <div class="botoes">
            <button class="mais" onclick="aumentar()">
                +
            </button>
            <button class="menos" onclick="diminuir()">
                -
            </button>
            <button class="reset" onclick="resetar()">
                Reset
            </button>
            <button id="inversion" onclick="inverter()">Modo Escuro</button>
        </div>
    </div>

    <script>

        const mudar = document.getElementById("inversion")

        mudar.addEventListener("click", function () {

            document.body.classList.toggle("dark-mode")

        })

        let contador = 0

        function aumentar() {

            contador++

            document.getElementById("numero").textContent = contador
        }

        function diminuir() {

            if (contador > 0) {

                contador--

                document.getElementById("numero").textContent = contador
            }

        }

        function resetar() {

            contador = 0

            document.getElementById("numero").textContent = contador
        }

    </script>

</body>

</html>
